# Runtime Cloud for Codex. Add this to ~/.codex/config.toml, or run:
#   codex mcp add runtime -- npx -y withruntime mcp
# It sends RUNTIME_API_KEY, or the key `npx withruntime login` saves once you approve it in the browser.
[mcp_servers.runtime]
command = "npx"
args = ["-y", "withruntime", "mcp"]
