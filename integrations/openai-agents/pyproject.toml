[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-agents-withruntime"
version = "0.1.0"
description = "Runtime Cloud sandboxes for the OpenAI Agents SDK: run a SandboxAgent in a Firecracker microVM"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Runtime LLC" }]
keywords = ["openai agents sdk", "openai-agents", "openai", "sandboxagent", "sandbox", "ai agents", "code execution", "code interpreter", "firecracker", "microvm", "runtime"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    # withruntime.openai_agents, the client this package names, first released
    # in 0.9.0's line; below 1.0, whose API may move.
    "withruntime[openai-agents]>=0.9.0,<1.0",
]

[project.urls]
Homepage = "https://withruntime.com"
Documentation = "https://withruntime.com/docs/openai-agents-sdk"
Repository = "https://github.com/withruntime/runtime/tree/main/integrations/openai-agents"

[tool.hatch.build.targets.wheel]
packages = ["openai_agents_withruntime"]

[tool.hatch.build.targets.sdist]
include = ["openai_agents_withruntime", "tests", "scripts", "README.md", "LICENSE"]
