[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smolagents-withruntime"
version = "0.1.0"
description = "Runtime Cloud sandboxes as a smolagents code executor: a CodeAgent's Python runs in a Firecracker microVM"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Runtime LLC" }]
keywords = ["smolagents", "hugging face", "codeagent", "executor", "sandbox", "ai agents", "code execution", "firecracker", "microvm", "runtime"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "smolagents>=1.26",
    # The sandbox interpreter (sbx.interpreter.run).
    "withruntime>=0.9.0,<1.0",
]

[project.entry-points."smolagents.executors"]
# Read by smolagents once executors are pluggable (huggingface/smolagents#2722):
# executor_type="runtime".
runtime = "smolagents_withruntime:RuntimeExecutor"

[project.urls]
Homepage = "https://withruntime.com"
Documentation = "https://withruntime.com/learn/integrations/smolagents"
Repository = "https://github.com/withruntime/runtime/tree/main/integrations/smolagents"

[tool.hatch.build.targets.wheel]
packages = ["smolagents_withruntime"]

[tool.hatch.build.targets.sdist]
include = ["smolagents_withruntime", "tests", "scripts", "README.md", "LICENSE"]
