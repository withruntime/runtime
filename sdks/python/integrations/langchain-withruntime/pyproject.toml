[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-withruntime"
version = "0.1.0"
description = "Runtime sandbox integration for Deep Agents"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Runtime LLC" }]
keywords = ["langchain", "deepagents", "sandbox", "firecracker", "microvm", "runtime"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents>=0.7.0,<0.8.0",
    # 0.6.0 and earlier cut long command output at 100,000 characters by
    # default, which broke read_file on files past about 75 KB. 0.6.1 returns it whole.
    "withruntime[deepagents]>=0.6.1",
]

[project.urls]
Homepage = "https://withruntime.com/docs/langchain"
Documentation = "https://withruntime.com/docs/langchain"
Source = "https://github.com/withruntime/runtime/tree/main/sdks/python/integrations/langchain-withruntime"

[project.entry-points."deepagents_code.sandbox_providers"]
runtime = "langchain_withruntime.provider:RuntimeProvider"

[dependency-groups]
test = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0",
    "langchain-tests>=1.1.9",
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_withruntime"]

[tool.hatch.build.targets.sdist]
include = ["langchain_withruntime", "tests", "scripts", "README.md", "LICENSE"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
